name: release-jsr-skills

'on':
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-jsr-skills
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate reference consistency
        shell: bash
        run: |
          set -euo pipefail
          errors=0

          echo "=== Checking SKILL.md reference links ==="
          # Extract all references/*.md mentioned in SKILL.md
          refs_in_skill=$(grep -oP 'references/[a-z0-9-]+\.md' jsr-reverse/SKILL.md | sort -u)
          for ref in $refs_in_skill; do
            if [ ! -f "jsr-reverse/$ref" ]; then
              echo "ERROR: SKILL.md references '$ref' but file does not exist"
              errors=$((errors + 1))
            fi
          done

          echo "=== Checking for orphaned reference files ==="
          # Find reference files not mentioned in SKILL.md
          for file in jsr-reverse/references/*.md; do
            basename=$(echo "$file" | sed 's|jsr-reverse/||')
            if ! grep -q "$basename" jsr-reverse/SKILL.md; then
              echo "WARNING: '$basename' exists but is not referenced in SKILL.md"
            fi
          done

          echo "=== Checking zh/ sync ==="
          # Compare file lists between en and zh
          en_refs=$(ls jsr-reverse/references/*.md 2>/dev/null | xargs -I{} basename {} | sort)
          zh_refs=$(ls zh/jsr-reverse/references/*.md 2>/dev/null | xargs -I{} basename {} | sort)
          en_only=$(comm -23 <(echo "$en_refs") <(echo "$zh_refs"))
          zh_only=$(comm -13 <(echo "$en_refs") <(echo "$zh_refs"))
          if [ -n "$en_only" ]; then
            echo "WARNING: Files in en/ but missing in zh/:"
            echo "$en_only" | sed 's/^/  - /'
          fi
          if [ -n "$zh_only" ]; then
            echo "WARNING: Files in zh/ but missing in en/:"
            echo "$zh_only" | sed 's/^/  - /'
          fi

          # Check SKILL.md sync
          if [ -f "zh/jsr-reverse/SKILL.md" ]; then
            en_lines=$(wc -l < jsr-reverse/SKILL.md)
            zh_lines=$(wc -l < zh/jsr-reverse/SKILL.md)
            diff_pct=$(( (en_lines - zh_lines) * 100 / en_lines ))
            if [ "${diff_pct#-}" -gt 20 ]; then
              echo "WARNING: SKILL.md line count differs by ${diff_pct#-}% (en: $en_lines, zh: $zh_lines) — may be out of sync"
            fi
          fi

          echo "=== Checking reference line counts ==="
          total_lines=0
          for file in jsr-reverse/references/*.md; do
            lines=$(wc -l < "$file")
            total_lines=$((total_lines + lines))
            if [ "$lines" -gt 300 ]; then
              echo "WARNING: $(basename $file) has $lines lines — consider splitting"
            fi
          done
          echo "Total reference lines: $total_lines"
          if [ "$total_lines" -gt 5000 ]; then
            echo "WARNING: Total reference volume exceeds 5000 lines — risk of reference inflation"
          fi

          echo "=== Checking cross-references between reference files ==="
          for file in jsr-reverse/references/*.md; do
            refs_in_file=$(grep -oP 'references/[a-z0-9-]+\.md' "$file" 2>/dev/null || true)
            for ref in $refs_in_file; do
              if [ ! -f "jsr-reverse/$ref" ]; then
                echo "ERROR: $(basename $file) references '$ref' but file does not exist"
                errors=$((errors + 1))
              fi
            done
          done

          if [ "$errors" -gt 0 ]; then
            echo "FAILED: $errors error(s) found"
            exit 1
          fi
          echo "All consistency checks passed."

  release:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          release_tag="jsr-skills-${GITHUB_RUN_NUMBER}-${short_sha}"
          asset_name="${release_tag}.zip"
          release_title="JSR Skills Build #${GITHUB_RUN_NUMBER} (${short_sha})"

          # Count references for release notes
          ref_count=$(ls jsr-reverse/references/*.md | wc -l)
          ref_lines=$(cat jsr-reverse/references/*.md | wc -l)

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "release_title=${release_title}" >> "$GITHUB_OUTPUT"
          echo "ref_count=${ref_count}" >> "$GITHUB_OUTPUT"
          echo "ref_lines=${ref_lines}" >> "$GITHUB_OUTPUT"

      - name: Build skills archive
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail

          mkdir -p dist/jsr-skills

          if [ ! -d "jsr-reverse" ]; then
            echo "Required skill directory jsr-reverse not found."
            exit 1
          fi

          cp -R "jsr-reverse" dist/jsr-skills/

          (
            cd dist
            zip -r "${ASSET_NAME}" jsr-skills
          )

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REF_COUNT: ${{ steps.meta.outputs.ref_count }}
          REF_LINES: ${{ steps.meta.outputs.ref_lines }}
        run: |
          cat > dist/release-notes.md <<EOF
          Automatically published JSR skills bundle.

          - Release: ${RELEASE_TITLE}
          - Tag: ${RELEASE_TAG}
          - Commit: ${COMMIT_SHA}
          - Workflow: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}
          - Run number: ${RUN_NUMBER}
          - Included skills:
            - jsr-reverse (${REF_COUNT} references, ${REF_LINES} total lines)
          - Asset: ${ASSET_NAME}
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file dist/release-notes.md

            gh release upload "${RELEASE_TAG}" "dist/${ASSET_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" "dist/${ASSET_NAME}" \
              --title "${RELEASE_TITLE}" \
              --notes-file dist/release-notes.md
          fi
